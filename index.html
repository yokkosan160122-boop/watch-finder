<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Watch Finder V2 (クラウド連携版)</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--green:#059669;--amber:#d97706;--red:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;padding-bottom:82px}
button,input,select{font:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:10;background:#111827;color:#fff;padding:13px 16px}
.top b{font-size:18px}
.top small{display:block;color:#94a3b8;margin-top:2px}
.main{max-width:760px;margin:auto;padding:15px}
.view{display:none}
.view.on{display:block}
h1{font-size:22px;margin:5px 0}
h2{font-size:17px;margin:0 0 10px}
.sub{font-size:12px;color:var(--muted);line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 11px;box-shadow:0 3px 14px #0f172a0b}
.hero{background:#111827;color:#fff;border:0}
.hero .sub{color:#cbd5e1}
.hero big{font-size:30px;font-weight:900}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.stat{background:#f8fafc;border-radius:11px;padding:9px}
.hero .stat{background:#ffffff12}
.stat small{display:block;color:var(--muted);font-size:10px}
.hero .stat small{color:#cbd5e1}
.stat strong{display:block;font-size:16px;margin-top:2px}
.btn{border:0;border-radius:10px;padding:11px 13px;font-weight:800}
.primary{background:var(--blue);color:#fff}
.secondary{background:#eef2f7;color:#334155}
.danger{background:#fef2f2;color:var(--red)}
.full{width:100%;margin-top:7px}
.small{font-size:11px;padding:8px 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.rank{width:34px;height:34px;border-radius:10px;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.gold{background:#d97706}
.silver{background:#64748b}
.bronze{background:#92400e}
.brand{font-size:11px;color:var(--muted);font-weight:800}
.model{font-size:16px;font-weight:900;word-break:break-word}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:11px 0}
.metric{background:#f8fafc;padding:8px;border-radius:10px}
.metric small{display:block;color:var(--muted);font-size:10px}
.metric b{font-size:15px}
.chip{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900}
.ok{background:#ecfdf5;color:var(--green)}
.warn{background:#fffbeb;color:var(--amber)}
.bad{background:#fef2f2;color:var(--red)}
.blue{background:#eff6ff;color:var(--blue)}
.gray{background:#f1f5f9;color:#475569}
.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;font-size:11px;font-weight:800}
.tab.active{background:#111827;color:#fff;border-color:#111827}
.search input,.field input,.field select,.field textarea{width:100%;border:1px solid #dbe2ea;border-radius:10px;padding:11px 12px;background:#fff;font-size:16px}
.field{margin-bottom:11px}
.field label{display:block;font-size:11px;font-weight:900;margin-bottom:5px}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.notice{padding:10px 11px;border-radius:11px;font-size:11px;line-height:1.5;margin:9px 0}
.notice.blue{background:#eff6ff;color:#1e40af}
.notice.bad{background:#fef2f2;color:#991b1b}
.empty{text-align:center;padding:35px 10px;color:var(--muted)}
.bottom{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fffffff2;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 5px calc(6px + env(safe-area-inset-bottom))}
.nav{border:0;background:none;color:#94a3b8;font-size:10px;font-weight:800;padding:3px}
.nav b{display:block;font-size:20px}
.nav.active{color:var(--blue)}
.modal{display:none;position:fixed;inset:0;background:#0f172a88;z-index:50;align-items:flex-end}
.modal.open{display:flex}
.sheet{width:100%;max-height:88vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:17px 15px calc(22px + env(safe-area-inset-bottom))}
.close{border:0;background:#f1f5f9;border-radius:50%;width:35px;height:35px;font-size:20px}
.toast{position:fixed;z-index:100;left:50%;bottom:95px;transform:translate(-50%,20px);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;opacity:0;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<body>

<header class="top">
<b>⌚ Watch Finder</b>
<small>eBay仕入れ判断ツール V2 (クラウド自動連携)</small>
</header>

<main class="main">

<section id="home" class="view on">
<div class="row">
<div>
<h1>今日の仕入れ候補</h1>
<div class="sub">利益・売れ行き・在庫・10日発送をまとめて判定</div>
</div>
<button class="btn primary small" onclick="edit()">＋登録</button>
</div>

<div id="hero"></div>

<div class="tabs">
<button class="tab active" onclick="homeFilter='all';tabs(this);home()">すべて</button>
<button class="tab" onclick="homeFilter='hot';tabs(this);home()">🔥 売れ筋</button>
<button class="tab" onclick="homeFilter='profit';tabs(this);home()">💰 高利益</button>
<button class="tab" onclick="homeFilter='safe';tabs(this);home()">🚚 10日安全</button>
</div>

<div id="homeList"></div>
</section>


<section id="items" class="view">
<div class="row">
<div>
<h1>商品データ</h1>
<div class="sub">型番ごとの販売・仕入条件</div>
</div>
<button class="btn primary small" onclick="edit()">＋追加</button>
</div>

<div class="search">
<input id="q" placeholder="メーカー・型番・仕入先で検索" oninput="items()">
</div>

<div class="tabs">
<button class="tab active" onclick="itemFilter='all';tabs(this);items()">全件</button>
<button class="tab" onclick="itemFilter='good';tabs(this);items()">おすすめ</button>
<button class="tab" onclick="itemFilter='available';tabs(this);items()">在庫あり</button>
<button class="tab" onclick="itemFilter='danger';tabs(this);items()">要注意</button>
</div>

<div id="itemList"></div>
</section>


<section id="form" class="view">
<h1 id="formTitle">商品登録</h1>
<div class="sub">メルカリURLを貼ると、価格・発送日数・在庫が自動取得されます</div>

<div class="card" style="background:#f0f9ff; border-color:#bae6fd; margin-bottom:15px;">
<div class="field" style="margin-bottom:8px;">
<label style="color:#0369a1;">🔴 メルカリ商品URLから自動読込</label>
<div style="display:flex; gap:8px;">
<input id="mercariUrl" placeholder="https://jp.mercari.com/item/mXXXXXXXXX">
<button type="button" class="btn primary" style="white-space:nowrap; padding:0 16px;" onclick="fetchMercariData()">自動取得</button>
</div>
</div>
<div id="mercariMsg" style="font-size:11px; color:#0284c7;"></div>
</div>

<form id="f" class="card">
<input type="hidden" id="id">

<div class="fields2">
<div class="field">
<label>メーカー *</label>
<input id="brand" required placeholder="CASIO">
</div>

<div class="field">
<label>型番 *</label>
<input id="model" required placeholder="GA-2100-1A1JF">
</div>
</div>

<div class="field">
<label>商品名・メモ</label>
<input id="name" placeholder="G-SHOCK">
</div>

<div class="fields2">
<div class="field">
<label>eBay販売価格 ($) *</label>
<input id="sell" type="number" step=".01" required>
</div>

<div class="field">
<label>為替 (円/$)</label>
<input id="fx" type="number" step=".1">
</div>
</div>

<div class="fields2">
<div class="field">
<label>仕入価格 (円) *</label>
<input id="cost" type="number" required>
</div>

<div class="field">
<label>仕入送料・手数料 (円)</label>
<input id="source" type="number">
</div>
</div>

<div class="fields2">
<div class="field">
<label>DDP送料 (円)</label>
<input id="ddp" type="number">
</div>

<div class="field">
<label>その他費用 (円)</label>
<input id="other" type="number">
</div>
</div>

<div class="fields2">
<div class="field">
<label>30日販売数</label>
<input id="sales" type="number">
</div>

<div class="field">
<label>競合出品数</label>
<input id="competition" type="number">
</div>
</div>

<div class="field">
<label>仕入先</label>
<select id="supplier"></select>
</div>

<div class="fields2">
<div class="field">
<label>仕入リードタイム (日)</label>
<input id="lead" type="number">
</div>

<div class="field">
<label>検品・発送準備 (日)</label>
<input id="prep" type="number">
</div>
</div>

<div class="field">
<label>仕入先在庫</label>
<select id="stock">
<option value="in">在庫あり</option>
<option value="low">残りわずか</option>
<option value="out">在庫なし</option>
<option value="unknown">不明</option>
</select>
</div>

<div id="preview"></div>

<button class="btn primary full">保存</button>
<button type="button" class="btn secondary full" onclick="show('items')">キャンセル</button>
</form>
</section>

<section id="suppliers" class="view">
<div class="row">
<div>
<h1>仕入先</h1>
<div class="sub">在庫・納期の管理</div>
</div>
<button class="btn primary small" onclick="supplierEdit()">＋追加</button>
</div>
<div id="supplierList"></div>
</section>

<section id="settings" class="view">
<h1>設定</h1>
<div class="sub">仕入れ判断の基準値</div>

<div class="card">
<div class="fields2">
<div class="field">
<label>eBay手数料 (%)</label>
<input id="fee" type="number" step=".1">
</div>
<div class="field">
<label>関税率 (%)</label>
<input id="tariff" type="number" step=".1">
</div>
<div class="field">
<label>為替 (円/$)</label>
<input id="sfx" type="number" step=".1">
</div>
<div class="field">
<label>発送期限 (日)</label>
<input id="handling" type="number">
</div>
</div>

<button id="ddpBtn" class="btn secondary full" onclick="toggleDdp()">DDP: ON</button>
<button class="btn primary full" onclick="saveSettings()">設定を保存</button>
</div>

<div class="card">
<button class="btn secondary full" onclick="backup()">データをバックアップ</button>
<button class="btn danger full" onclick="resetAll()">全データ初期化</button>
</div>
</section>

</main>

<nav class="bottom">
<button class="nav active" id="n-home" onclick="show('home')"><b>🔥</b>おすすめ</button>
<button class="nav" id="n-items" onclick="show('items')"><b>⌚</b>商品</button>
<button class="nav" id="n-form" onclick="edit()"><b>＋</b>登録</button>
<button class="nav" id="n-suppliers" onclick="show('suppliers')"><b>🏪</b>仕入先</button>
<button class="nav" id="n-settings" onclick="show('settings')"><b>⚙️</b>設定</button>
</nav>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
<div class="sheet" id="sheet"></div>
</div>

<div id="toast" class="toast"></div>

<script>
// --- Google Cloud API エンドポイント ---
const API_URL = 'https://mercari-scraper-848647612354.asia-northeast1.run.app/scrape';

const K='watch_finder_v2',
D={
settings:{fee:18,tariff:15,fx:150,handling:10,ddp:true},
suppliers:[{id:1,name:'メルカリ',url:'https://jp.mercari.com',days:3,stock:'in',memo:'メルカリ仕入れ'}],
items:[]
};

let db=load(), homeFilter='all', itemFilter='all';

function load(){
  try{
    let x=JSON.parse(localStorage.getItem(K));
    if(x?.settings&&x?.items&&x?.suppliers) return x;
  }catch(e){}
  localStorage.setItem(K,JSON.stringify(D));
  return JSON.parse(JSON.stringify(D));
}

function save(){ localStorage.setItem(K,JSON.stringify(db)); }
function n(id){ return Number(document.getElementById(id).value)||0; }
function yen(x){ return '¥'+Math.round(x||0).toLocaleString(); }
function usd(x){ return '$'+Number(x||0).toFixed(2); }
function esc(x){ return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
function sup(id){ return db.suppliers.find(x=>Number(x.id)===Number(id)); }

function stock(x){
  let c=x==='in'?'ok':x==='low'?'warn':x==='out'?'bad':'gray';
  let t={in:'在庫あり',low:'残りわずか',out:'在庫なし',unknown:'不明'}[x]||'不明';
  return `<span class="chip ${c}">${t}</span>`;
}

function calc(x){
  let s=db.settings, fx=+x.fx||s.fx, p=+x.sell||0;
  let tar=s.ddp?p*s.tariff/100:0, ds=s.ddp?(+x.ddp||0):0; // dsは円のDDP送料として直接加算
  let total=p+tar, fee=total*s.fee/100; // 外貨ベースの計算に直接円のDDPを引く形に調整
  // 利益計算: (eBay販売価格*為替 - 手数料等) - 関税(円換算) - DDP送料(円) - 仕入価格 - 仕入送料 - その他費用
  let profit=Math.round((p-fee)*fx - tar*fx - ds - (+x.cost||0) - (+x.source||0) - (+x.other||0));
  let margin=p?profit/(p*fx)*100:0;
  let days=(+x.lead||0)+(+x.prep||0);
  let safe=days<=s.handling;
  let sales=+x.sales||0, comp=+x.competition||0;

  let score=Math.min(30,sales*2)+Math.max(0,Math.min(30,profit/1000))+(comp?Math.max(0,15-comp/20):8)+(safe?15:0)+(x.stock==='in'?10:x.stock==='low'?6:x.stock==='unknown'?2:0);
  score=Math.round(Math.min(100,score));

  let label=score>=80?'強くおすすめ':score>=60?'おすすめ':score>=40?'要注意':'非推奨';
  let cls=score>=80?'ok':score>=60?'blue':score>=40?'warn':'bad';

  if(x.stock==='out'){ label='仕入不可'; cls='bad'; }
  else if(!safe){ label='10日超過'; cls='bad'; }

  return{ profit, margin, days, safe, score, label, cls };
}

// --- メルカリ自動取得関数 (クラウド通信) ---
async function fetchMercariData(){
  const url = document.getElementById('mercariUrl').value.trim();
  const msgEl = document.getElementById('mercariMsg');
  if(!url){
    msgEl.innerText = "⚠️ メルカリのURLを入力してください";
    return;
  }
  
  msgEl.innerText = "⏳ メルカリからデータ取得中...";

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: url })
    });
    
    const data = await res.json();
    if(!res.ok || data.error){
      msgEl.innerText = "❌ エラー: " + (data.error || "データ取得失敗");
      return;
    }

    // フォームに反映
    if(data.cost) document.getElementById('cost').value = data.cost;
    if(data.lead) document.getElementById('lead').value = data.lead;
    if(data.stock) document.getElementById('stock').value = data.stock;
    if(data.title && !document.getElementById('name').value){
      document.getElementById('name').value = data.title;
    }

    msgEl.innerText = "✅ データの取得・反映が完了しました！";
    preview();

  } catch (err) {
    msgEl.innerText = "❌ 接続エラー: クラウドサーバーの呼び出しに失敗しました";
  }
}

function show(v){
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  document.getElementById(v).classList.add('on');
  document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));
  document.getElementById('n-'+v)?.classList.add('active');

  if(v==='home')home();
  if(v==='items')items();
  if(v==='suppliers')suppliers();
  if(v==='settings')settings();
  scrollTo(0,0);
}

function tabs(el){
  el.parentElement.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
}

function productCard(x,i){
  let m=calc(x), s=sup(x.supplier);
  let r=i<4?`<div class="rank ${i===1?'gold':i===2?'silver':i===3?'bronze':''}">${i}</div>`:`<div class="rank">${i}</div>`;

  return `
  <div class="card">
    <div class="row">
      <div style="display:flex;gap:9px;align-items:center;min-width:0">
        ${r}
        <div>
          <div class="brand">${esc(x.brand)}</div>
          <div class="model">${esc(x.model)}</div>
          <div class="sub">${esc(x.name||'')}</div>
        </div>
      </div>
      <div style="text-align:right">
        <b>${m.score}</b>
        <div class="chip ${m.cls}">${m.label}</div>
      </div>
    </div>

    <div class="metrics">
      <div class="metric"><small>eBay販売</small><b>${usd(x.sell)}</b></div>
      <div class="metric"><small>予想利益</small><b style="color:${m.profit>=0?'var(--green)':'var(--red)'}">${yen(m.profit)}</b></div>
      <div class="metric"><small>利益率</small><b>${m.margin.toFixed(1)}%</b></div>
      <div class="metric"><small>30日販売</small><b>${x.sales||0}個</b></div>
    </div>

    <div class="row">
      <span>${stock(x.stock)} 🚚 ${m.days}/${db.settings.handling}日</span>
      <button class="btn secondary small" onclick="detail(${x.id})">詳細</button>
    </div>
  </div>`;
}

function home(){
  let a=db.items.map(x=>({...x,m:calc(x)}));
  let good=a.filter(x=>x.m.score>=60 && x.stock!=='out' && x.m.safe);
  let avg=good.length?good.reduce((z,x)=>z+x.m.profit,0)/good.length:0;

  document.getElementById('hero').innerHTML=`
  <div class="card hero">
    <div class="sub">登録 ${a.length}件</div>
    <big>${good.length}件</big>
    <div>おすすめ候補</div>
    <div class="g3" style="margin-top:11px">
      <div class="stat"><small>平均利益</small><strong>${yen(avg)}</strong></div>
      <div class="stat"><small>10日以内</small><strong>${a.filter(x=>x.m.safe).length}/${a.length}</strong></div>
      <div class="stat"><small>在庫あり</small><strong>${a.filter(x=>x.stock==='in').length}</strong></div>
    </div>
  </div>`;

  if(homeFilter==='hot') a.sort((x,y)=>(y.sales||0)-(x.sales||0));
  else if(homeFilter==='profit') a.sort((x,y)=>y.m.profit-x.m.profit);
  else if(homeFilter==='safe') a=a.filter(x=>x.m.safe&&x.stock!=='out');
  else a.sort((x,y)=>y.m.score-x.m.score);

  document.getElementById('homeList').innerHTML=a.slice(0,10).map((x,i)=>productCard(x,i+1)).join('')||'<div class="empty">候補がありません。</div>';
}

function items(){
  let q=(document.getElementById('q')?.value||'').toLowerCase();
  let a=db.items.filter(x=>(`${x.brand} ${x.model} ${x.name} ${sup(x.supplier)?.name||''}`).toLowerCase().includes(q));

  if(itemFilter==='good') a=a.filter(x=>calc(x).score>=60);
  if(itemFilter==='available') a=a.filter(x=>x.stock==='in'||x.stock==='low');
  if(itemFilter==='danger') a=a.filter(x=>!calc(x).safe || x.stock==='out' || calc(x).score<40);

  a.sort((x,y)=>calc(y).score-calc(x).score);
  document.getElementById('itemList').innerHTML=a.map((x,i)=>productCard(x,i+1)).join('')||'<div class="empty">商品がありません。</div>';
}

function edit(id=null){
  let x=id&&db.items.find(z=>z.id===id);
  document.getElementById('f').reset();
  document.getElementById('mercariUrl').value='';
  document.getElementById('mercariMsg').innerText='';
  document.getElementById('id').value=x?.id||'';
  document.getElementById('formTitle').textContent=x?'商品を編集':'商品登録';

  document.getElementById('supplier').innerHTML='<option value="">未設定</option>'+db.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');

  let vals={
    brand:x?.brand||'', model:x?.model||'', name:x?.name||'', sell:x?.sell||'', fx:x?.fx||db.settings.fx,
    cost:x?.cost||'', source:x?.source||0, ddp:x?.ddp??3500, other:x?.other||0, sales:x?.sales||0,
    competition:x?.competition||0, supplier:x?.supplier||1, lead:x?.lead??3, prep:x?.prep??2, stock:x?.stock||'in'
  };

  Object.keys(vals).forEach(k=>document.getElementById(k).value=vals[k]);
  show('form');
  preview();
}

function formData(){
  return{
    id:+document.getElementById('id').value||Date.now(),
    brand:document.getElementById('brand').value.trim(),
    model:document.getElementById('model').value.trim(),
    name:document.getElementById('name').value.trim(),
    sell:n('sell'), fx:n('fx')||db.settings.fx, cost:n('cost'), source:n('source'),
    ddp:n('ddp'), other:n('other'), sales:n('sales'), competition:n('competition'),
    supplier:+document.getElementById('supplier').value||null,
    lead:n('lead'), prep:n('prep'), stock:document.getElementById('stock').value
  };
}

function preview(){
  let x=formData(), m=calc(x);
  document.getElementById('preview').innerHTML=`
  <div class="card" style="background:#f8fafc">
    <b>自動判定</b>
    <div class="g2" style="margin-top:8px">
      <div class="stat"><small>予想利益</small><strong style="color:${m.profit>=0?'var(--green)':'var(--red)'}">${yen(m.profit)}</strong></div>
      <div class="stat"><small>利益率</small><strong>${m.margin.toFixed(1)}%</strong></div>
      <div class="stat"><small>発送まで</small><strong>${m.days}日 / ${db.settings.handling}日</strong></div>
      <div class="stat"><small>評価</small><strong><span class="chip ${m.cls}">${m.label} ${m.score}</span></strong></div>
    </div>
    ${!m.safe?'<div class="notice bad">⚠️ 仕入＋検品準備が発送期限を超えています。</div>':''}
  </div>`;
}

document.getElementById('f').addEventListener('input',preview);
document.getElementById('f').addEventListener('submit',e=>{
  e.preventDefault();
  let x=formData();
  if(!x.brand||!x.model||!x.sell||!x.cost) return toast('メーカー・型番・販売価格・仕入価格を入力してください');

  let i=db.items.findIndex(z=>z.id===x.id);
  if(i>=0) db.items[i]=x;
  else db.items.push(x);

  save();
  toast(i>=0?'更新しました':'登録しました');
  show('home');
});

function detail(id){
  let x=db.items.find(z=>z.id===id), m=calc(x), s=sup(x.supplier);
  document.getElementById('sheet').innerHTML=`
  <div class="row">
    <div><div class="brand">${esc(x.brand)}</div><h2>${esc(x.model)}</h2></div>
    <button class="close" onclick="closeModal()">×</button>
  </div>
  <div class="card">
    <div class="g2">
      <div class="stat"><small>評価</small><strong>${m.score}/100</strong></div>
      <div class="stat"><small>判定</small><strong><span class="chip ${m.cls}">${m.label}</span></strong></div>
      <div class="stat"><small>予想利益</small><strong>${yen(m.profit)}</strong></div>
      <div class="stat"><small>利益率</small><strong>${m.margin.toFixed(1)}%</strong></div>
    </div>
  </div>
  <div class="notice ${m.safe?'blue':'bad'}">🚚 仕入 ${x.lead||0}日 ＋ 検品 ${x.prep||0}日 ＝ <b>${m.days}日</b>（期限 ${db.settings.handling}日）</div>
  <div class="card"><div class="sub">仕入先</div><b>${esc(s?.name||'未設定')}</b><div style="margin-top:7px">${stock(x.stock)} ${s?.days||x.lead||0}日程度</div></div>
  <button class="btn primary full" onclick="closeModal();edit(${x.id})">編集</button>
  <button class="btn danger full" onclick="closeModal();del(${x.id})">削除</button>`;
  document.getElementById('modal').classList.add('open');
}

function closeModal(){ document.getElementById('modal').classList.remove('open'); }
function del(id){
  if(confirm('この商品を削除しますか？')){
    db.items=db.items.filter(x=>x.id!==id);
    save(); home(); items(); toast('削除しました');
  }
}

function suppliers(){
  document.getElementById('supplierList').innerHTML=db.suppliers.map(s=>`
  <div class="card">
    <div class="row">
      <div><div class="model">${esc(s.name)}</div><div class="sub">${esc(s.url||'URL未設定')}</div></div>
      <button class="btn secondary small" onclick="supplierEdit(${s.id})">編集</button>
    </div>
    <div style="margin-top:9px">${stock(s.stock)} 🚚 ${s.days||0}日 📦 ${db.items.filter(x=>x.supplier===s.id).length}商品</div>
  </div>`).join('')||'<div class="empty">仕入先がありません。</div>';
}

function supplierEdit(id=null){
  let s=id?db.suppliers.find(x=>x.id===id):{id:null,name:'',url:'',days:3,stock:'in',memo:''};
  document.getElementById('sheet').innerHTML=`
  <div class="row"><h2>${id?'仕入先を編集':'仕入先を追加'}</h2><button class="close" onclick="closeModal()">×</button></div>
  <div class="field"><label>仕入先名</label><input id="sn" value="${esc(s.name)}"></div>
  <div class="id"><label>URL</label><input id="su" value="${esc(s.url)}"></div>
  <div class="field"><label>標準リードタイム(日)</label><input id="sd" type="number" value="${s.days||3}"></div>
  <button class="btn primary full" onclick="saveSupplier(${id||0})">保存</button>`;
  document.getElementById('modal').classList.add('open');
}

function saveSupplier(id){
  let x={ id:id||Date.now(), name:document.getElementById('sn').value.trim(), url:document.getElementById('su').value.trim(), days:+document.getElementById('sd').value||0, stock:'in', memo:'' };
  if(!x.name) return toast('仕入先名を入力してください');
  let i=db.suppliers.findIndex(z=>z.id===x.id);
  if(i>=0) db.suppliers[i]=x; else db.suppliers.push(x);
  save(); closeModal(); suppliers(); toast('保存しました');
}

function settings(){
  document.getElementById('fee').value=db.settings.fee;
  document.getElementById('tariff').value=db.settings.tariff;
  document.getElementById('sfx').value=db.settings.fx;
  document.getElementById('handling').value=db.settings.handling;
  document.getElementById('ddpBtn').textContent='DDP: '+(db.settings.ddp?'ON':'OFF');
}

function toggleDdp(){ db.settings.ddp=!db.settings.ddp; settings(); }
function saveSettings(){
  db.settings.fee=+document.getElementById('fee').value||18;
  db.settings.tariff=+document.getElementById('tariff').value||15;
  db.settings.fx=+document.getElementById('sfx').value||150;
  db.settings.handling=+document.getElementById('handling').value||10;
  save(); home(); toast('設定を保存しました');
}

function backup(){
  let a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));
  a.download='watch-finder-backup.json';
  a.click();
  toast('バックアップを作成しました');
}

function resetAll(){
  if(confirm('全データを初期状態に戻しますか？')){
    localStorage.removeItem(K); db=load(); settings(); home(); toast('初期化しました');
  }
}

function toast(t){
  let x=document.getElementById('toast');
  x.textContent=t; x.classList.add('show');
  clearTimeout(window.tt);
  window.tt=setTimeout(()=>x.classList.remove('show'),1800);
}

home(); items(); suppliers(); settings();
</script>
</body>
</html>
